<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كورس قاعة DRAGON GYM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        /* =========================================================
           Screen Styles (Input Interface)
           ========================================================= */
        @media screen {
            #print-layout { display: none; }

            body {
                font-family: 'Cairo', sans-serif;
                background: #f0f2f5;
                padding: 20px;
                margin: 0;
                direction: rtl;
            }
            .container {
                max-width: 1000px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
            h1.app-title {
                text-align: center;
                color: #1a237e;
                margin-bottom: 30px;
                font-weight: 900;
                direction: ltr;
            }
            .form-section {
                border: 2px solid #e0e0e0;
                padding: 20px;
                border-radius: 8px;
                margin-bottom: 25px;
                background: #fff;
            }
            .form-section legend {
                font-weight: bold;
                color: #d32f2f;
                padding: 0 10px;
                font-size: 1.3em;
                background: white;
            }
            .row {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                margin-bottom: 15px;
            }
            .form-group {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 150px;
            }
            .form-group.large { flex: 2; }
            .form-group label {
                margin-bottom: 8px;
                font-weight: bold;
                color: #333;
            }
            .form-group input, .form-group textarea {
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-family: inherit;
                font-size: 16px;
                transition: border-color 0.3s;
            }
            .form-group input:focus, .form-group textarea:focus {
                border-color: #1a237e;
                outline: none;
                box-shadow: 0 0 5px rgba(26, 35, 126, 0.2);
            }

            .days-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .day-card {
                background: #f9f9f9;
                padding: 20px;
                border-radius: 8px;
                border: 1px solid #e0e0e0;
            }
            .day-card h3 {
                margin-top: 0;
                color: #1a237e;
                border-bottom: 2px solid #1a237e;
                padding-bottom: 8px;
                display: inline-block;
            }
            .exercise-input-group {
                display: flex;
                gap: 10px;
                margin-bottom: 12px;
                align-items: center;
            }
            .exercise-input-group span {
                font-weight: bold;
                min-width: 25px;
                color: #555;
            }
            .exercise-input-group input {
                flex: 1;
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: inherit;
            }
            .exercise-input-group input:focus {
                border-color: #1a237e;
                outline: none;
            }

            .btn-add-day {
                display: inline-block;
                padding: 10px 15px;
                background: #4caf50;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 15px;
                transition: background 0.3s;
            }
            .btn-add-day:hover { background: #388e3c; }

            .btn-print {
                display: block;
                width: 100%;
                padding: 18px;
                background: #1a237e;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 22px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 20px;
                transition: background 0.3s, transform 0.1s;
                box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            }
            .btn-print:hover { background: #0d134a; }
            .btn-print:active { transform: scale(0.98); }

            @media (max-width: 768px) {
                .days-grid { grid-template-columns: 1fr; }
            }
        }

        /* =========================================================
           Print Layout Styles
           ========================================================= */
        .paper {
            width: 210mm;
            height: 297mm;
            position: relative;
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            background-color: white;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .paper:last-child {
            page-break-after: auto;
            break-after: auto;
            margin-bottom: 0;
        }

        .print-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: fill;
        }

        .abs-val {
            position: absolute;
            z-index: 2;
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            font-weight: bold;
            color: #000;
            text-align: center;
            direction: rtl;
            padding: 0 5px;
        }

        .val-name { top: 28.3%; left: 5%; width: 14%; }
        .val-age { top: 31.5%; left: 5%; width: 14%; }
        .val-height { top: 35.5%; left: 5%; width: 14%; }
        .val-weight { top: 39.5%; left: 5%; width: 14%; }
        .val-date-from { top: 43.5%; left: 5%; width: 14%; }
        .val-date-to { top: 47.5%; left: 5%; width: 14%; }

        .footer-phone {
            position: absolute;
            z-index: 2;
            bottom: 1.6%;
            left: 12.5%;
            width: 12.5%;
            height: 16px;
            background-color: #000;
            color: #d1d5db;
            font-family: Arial, sans-serif;
            font-size: 8pt;
            font-weight: bold;
            direction: ltr;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-insta {
            position: absolute;
            z-index: 2;
            bottom: 1.6%;
            left: 56.2%;
            width: 13.8%;
            height: 16px;
            background-color: #000;
            color: #d1d5db;
            font-family: Arial, sans-serif;
            font-size: 7.8pt;
            font-weight: bold;
            direction: ltr;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-fb {
            position: absolute;
            z-index: 2;
            bottom: 1.6%;
            left: 34.2%;
            width: 13.8%;
            height: 16px;
            background-color: #000;
            color: #d1d5db;
            font-family: 'Cairo', sans-serif;
            font-size: 6.8pt;
            font-weight: bold;
            white-space: nowrap;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workout-box {
            position: absolute;
            z-index: 2;
            top: 22%;
            left: 31%;
            width: 38%;
            height: auto;
            background-color: transparent;
            border: none;
            padding: 8px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .day-title {
            background-color: #111827;
            color: #b38836;
            text-align: center;
            padding: 5px;
            font-size: 12pt;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .exercise-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .exercise-num {
            font-weight: bold;
            margin-left: 6px;
            min-width: 20px;
            font-size: 9.5pt;
            white-space: nowrap;
            color: #111827;
            flex-shrink: 0;
        }
        .exercise-val {
            flex-grow: 1;
            border-bottom: 1px dotted #111827;
            font-size: 10pt;
            padding: 0 3px;
            min-height: 14pt;
            color: #000;
            font-weight: bold;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.15;
        }
        .notes-section {
            position: absolute;
            z-index: 2;
            bottom: 5%;
            left: 31%;
            width: 38%;
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
            font-size: 9pt;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 5px;
            border-radius: 4px;
            border: 1px dashed #d32f2f;
            max-height: 7%;
            overflow: hidden;
        }

        /* =========================================================
           Print Styles
           ========================================================= */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0 !important;
            }
            #input-form { display: none !important; }
            #print-layout { display: block !important; }

            * {
                line-height: 1.15 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                background: none;
                padding: 0 !important;
                margin: 0 !important;
                font-family: 'Cairo', sans-serif;
                direction: rtl;
                width: 100% !important;
                height: 100% !important;
            }

            .paper {
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                page-break-inside: avoid !important;
                page-break-after: always !important;
                break-after: page !important;
                overflow: hidden !important;
                border: none !important;
                position: relative;
            }

            .paper:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
        }
    </style>
</head>
<body>
    <img src="hero.png" style="display:none;" id="preload-hero">
    <img src="template.jpg" style="display:none;" id="preload-template">
    <datalist id="exercise-suggestions"></datalist>
    <datalist id="name-suggestions"></datalist>

    <!-- =========================================================
         Input Interface
         ========================================================= -->
    <div class="container" id="input-form">
        <h1 class="app-title">نظام إدارة كورسات DRAGON GYM</h1>

        <fieldset class="form-section">
            <legend>معلومات اللاعب</legend>
            <div class="row">
                <div class="form-group large">
                    <label>الاسم الثلاثي</label>
                    <input type="text" id="in_name" placeholder="ادخل الاسم هنا" autocomplete="on" list="name-suggestions">
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" id="in_age">
                </div>
                <div class="form-group">
                    <label>الطول (سم)</label>
                    <input type="number" id="in_height">
                </div>
                <div class="form-group">
                    <label>الوزن (كغ)</label>
                    <input type="number" id="in_weight">
                </div>
                <div class="form-group">
                    <label>التاريخ من</label>
                    <input type="date" id="in_date">
                </div>
                <div class="form-group">
                    <label>التاريخ إلى</label>
                    <input type="date" id="in_date_to">
                </div>
            </div>
        </fieldset>

        <fieldset class="form-section">
            <legend>التمارين (الكورس)</legend>
            <div class="days-grid" id="in_days_container"></div>
            <button class="btn-add-day" onclick="addDay()">➕ إضافة يوم تمرين جديد</button>
        </fieldset>

        <fieldset class="form-section">
            <legend>ملاحظات إضافية</legend>
            <div class="form-group">
                <textarea id="in_notes" rows="3" placeholder="اكتب أي ملاحظات خاصة باللاعب أو الكورس هنا..."></textarea>
            </div>
        </fieldset>

        <button class="btn-print" onclick="prepareAndPrint()">🖨️ تجهيز وطباعة الورقة</button>
    </div>

    <!-- =========================================================
         Print Template
         ========================================================= -->
    <div id="print-layout"></div>

    <!-- =========================================================
         JavaScript
         ========================================================= -->
    <script>
        const dayNamesArabic = ['', 'الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر'];
        let dayCount = 0;

        function loadSuggestions() {
            let savedExercises = JSON.parse(localStorage.getItem('dragonGymExercises') || '[]');
            let savedNames = JSON.parse(localStorage.getItem('dragonGymNames') || '[]');

            const exList = document.getElementById('exercise-suggestions');
            exList.innerHTML = savedExercises.map(ex => `<option value="${ex}">`).join('');

            const nameList = document.getElementById('name-suggestions');
            nameList.innerHTML = savedNames.map(name => `<option value="${name}">`).join('');
        }

        function saveSuggestions() {
            let savedExercises = JSON.parse(localStorage.getItem('dragonGymExercises') || '[]');
            let savedNames = JSON.parse(localStorage.getItem('dragonGymNames') || '[]');

            const nameVal = document.getElementById('in_name').value.trim();
            if (nameVal && !savedNames.includes(nameVal)) {
                savedNames.push(nameVal);
            }

            for (let dayIndex = 0; dayIndex < dayCount; dayIndex++) {
                for (let row = 1; row <= 10; row++) {
                    const exerciseId = `ex_${dayIndex}_${row}`;
                    const valEl = document.getElementById(`in_${exerciseId}`);
                    if (valEl) {
                        const val = valEl.value.trim();
                        if (val && !savedExercises.includes(val)) {
                            savedExercises.push(val);
                        }
                    }
                }
            }

            localStorage.setItem('dragonGymExercises', JSON.stringify(savedExercises));
            localStorage.setItem('dragonGymNames', JSON.stringify(savedNames));
            loadSuggestions();
        }

        function addDay() {
            dayCount++;
            const dayName = `اليوم ${dayNamesArabic[dayCount] || dayCount}:`;
            const dayIndex = dayCount - 1;

            const inDaysContainer = document.getElementById('in_days_container');

            const inDayCard = document.createElement('div');
            inDayCard.className = 'day-card';
            inDayCard.innerHTML = `<h3>${dayName}</h3>`;

            for (let i = 1; i <= 10; i++) {
                const exerciseId = `ex_${dayIndex}_${i}`;
                const inRow = document.createElement('div');
                inRow.className = 'exercise-input-group';
                inRow.innerHTML = `
                    <span>${i} -</span>
                    <input type="text" id="in_${exerciseId}" autocomplete="on" list="exercise-suggestions">
                `;
                inDayCard.appendChild(inRow);
            }

            inDaysContainer.appendChild(inDayCard);
        }

        for (let i = 0; i < 4; i++) {
            addDay();
        }

        document.getElementById('in_date').valueAsDate = new Date();
        loadSuggestions();

        function prepareAndPrint() {
            const printLayout = document.getElementById('print-layout');
            printLayout.innerHTML = '';

            const nameVal = document.getElementById('in_name').value || '';
            const ageVal = document.getElementById('in_age').value || '';
            const heightVal = document.getElementById('in_height').value || '';
            const weightVal = document.getElementById('in_weight').value || '';
            const dateVal = document.getElementById('in_date').value || '';
            const dateToVal = document.getElementById('in_date_to').value || '';
            const notesContent = document.getElementById('in_notes').value || '';

            for (let dayIndex = 0; dayIndex < dayCount; dayIndex++) {
                let dayHTML = '';
                let hasExercises = false;

                for (let row = 1; row <= 10; row++) {
                    const exerciseId = `ex_${dayIndex}_${row}`;
                    const valEl = document.getElementById(`in_${exerciseId}`);
                    let val = '';
                    if (valEl) val = valEl.value;

                    if (val.trim() !== '') hasExercises = true;

                    dayHTML += `
                        <div class="exercise-row">
                            <span class="exercise-num">${row} -</span>
                            <div class="exercise-val">${val}</div>
                        </div>
                    `;
                }

                if (!hasExercises && dayIndex > 0) continue;

                const dayName = dayNamesArabic[dayIndex + 1] || (dayIndex + 1);

                const paperDiv = document.createElement('div');
                paperDiv.className = 'paper';

                const notesHTML = notesContent.trim() ? `<div class="notes-section">${notesContent}</div>` : '';

                paperDiv.innerHTML = `
                    <img src="template.jpg" class="print-bg">
                    <div class="footer-phone">0770 137 1373</div>
                    <div class="footer-fb">عمار عبدالعزيز الممشهداني</div>
                    <div class="footer-insta">captain_ammar1</div>
                    <div class="abs-val val-name">${nameVal}</div>
                    <div class="abs-val val-age">${ageVal}</div>
                    <div class="abs-val val-height">${heightVal}</div>
                    <div class="abs-val val-weight">${weightVal}</div>
                    <div class="abs-val val-date-from">${dateVal}</div>
                    <div class="abs-val val-date-to">${dateToVal}</div>

                    <div class="workout-box">
                        <div class="day-title">اليوم ${dayName}</div>
                        ${dayHTML}
                    </div>
                    ${notesHTML}
                `;

                printLayout.appendChild(paperDiv);
            }

            saveSuggestions();

            document.getElementById('input-form').style.display = 'none';
            printLayout.style.display = 'block';

            setTimeout(() => {
                window.print();

                document.getElementById('input-form').style.display = 'block';
                printLayout.style.display = 'none';
            }, 800);
        }
    </script>
    <script src="tracker.js"></script>
</body>
</html>
